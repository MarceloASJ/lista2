<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card de Produto Responsivo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-produto">
        <div class="card-imagem">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&auto=format&fit=crop&q=60" alt="Relógio Minimalista">
        </div>
        <div class="card-conteudo">
            <span class="categoria">Acessórios</span>
            <h2>Relógio Minimalista Moderno</h2>
            <p class="descricao">Um relógio elegante com design minimalista, bracelete em pele genuína e resistência à água ideal para o dia a dia.</p>
            <div class="preco">R$ 299,90</div>
            <button class="btn-comprar">Comprar</button>
        </div>
    </div>

</body>
</html>
