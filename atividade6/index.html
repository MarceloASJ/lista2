<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Desconto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Simulador de Desconto</h1>

        <div class="grupo-formulario">
            <label for="valorCompra">Valor da Compra (R$):</label>
            <input type="number" id="valorCompra" placeholder="Ex: 600.00" step="any">
        </div>

        <div class="grupo-formulario">
            <label for="percentualDesconto">Percentual de Desconto (%):</label>
            <input type="number" id="percentualDesconto" placeholder="Ex: 10" step="any">
        </div>

        <button id="btnSimular">Calcular Desconto</button>

        <div id="resultado" class="resultado oculto"></div>
        <div id="mensagemErro" class="erro oculto"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
