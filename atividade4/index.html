<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Temperatura</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="conversor-container">
        <h1>Conversor de Temperatura</h1>
        
        <div class="grupo-formulario">
            <label for="temperatura">Temperatura:</label>
            <input type="number" id="temperatura" placeholder="Digite o valor..." step="any">
        </div>

        <div class="grupo-formulario">
            <label for="escalaOrigem">De:</label>
            <select id="escalaOrigem">
                <option value="celsius">Celsius (°C)</option>
                <option value="fahrenheit">Fahrenheit (°F)</option>
            </select>
        </div>

        <div class="grupo-formulario">
            <label for="escalaDestino">Para:</label>
            <select id="escalaDestino">
                <option value="fahrenheit">Fahrenheit (°F)</option>
                <option value="celsius">Celsius (°C)</option>
            </select>
        </div>

        <button id="btnConverter">Converter</button>

        <div id="resultado" class="resultado oculto"></div>
        <div id="mensagemErro" class="erro oculto"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
